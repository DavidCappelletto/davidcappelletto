<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">Validazione, un passaggio alla volta</title><desc id="desc">Il progetto è in costruzione e verifica.</desc><rect width="960" height="660" rx="28" fill="#f3f7f8"/><g font-family="Arial,sans-serif"><text x="48" y="65" fill="#257d75" font-size="20" font-weight="700" letter-spacing="2">STUDIO DENTISTICO · PROCESSO</text><text x="48" y="122" fill="#14253c" font-size="36" font-weight="700">Validazione, un passaggio alla volta</text><text x="48" y="164" fill="#536576" font-size="23">Il progetto è in costruzione e verifica.</text><rect x="48" y="212" width="864" height="106" rx="18" fill="white" stroke="#d5e1e5"/><circle cx="96" cy="265" r="23" fill="#2ba89a"/><text x="96" y="273" text-anchor="middle" font-size="24" font-weight="700" fill="white">1</text><text x="140" y="254" font-size="27" fill="#14253c" font-weight="700">Simula i casi</text><text x="140" y="290" font-size="22" fill="#536576">Appuntamento valido, dato mancante, nessuna risposta</text><rect x="48" y="334" width="864" height="106" rx="18" fill="white" stroke="#d5e1e5"/><circle cx="96" cy="387" r="23" fill="#2ba89a"/><text x="96" y="395" text-anchor="middle" font-size="24" font-weight="700" fill="white">2</text><text x="140" y="376" font-size="27" fill="#14253c" font-weight="700">Controlla gli esiti</text><text x="140" y="412" font-size="22" fill="#536576">Verifica il percorso e il passaggio allo studio</text><rect x="48" y="456" width="864" height="106" rx="18" fill="white" stroke="#d5e1e5"/><circle cx="96" cy="509" r="23" fill="#b5812a"/><text x="96" y="517" text-anchor="middle" font-size="24" font-weight="700" fill="white">3</text><text x="140" y="498" font-size="27" fill="#14253c" font-weight="700">Misura sul campo</text><text x="140" y="534" font-size="22" fill="#536576">Tempi e assenze: risultati ancora da verificare</text><text x="48" y="618" fill="#536576" font-size="19">Schema dimostrativo · nessun dato personale reale</text></g></svg>