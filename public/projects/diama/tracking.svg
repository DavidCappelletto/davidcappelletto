<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Architettura di tracking del sito DIAMA Service</title>
  <desc id="desc">Diagramma del flusso dagli eventi del sito al consenso, Google Tag Manager, GA4, Meta Pixel e Search Console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="1" stop-color="#123b58"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e33045"/>
      <stop offset="1" stop-color="#0b78bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020b13" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#62c7bf"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <circle cx="1290" cy="80" r="220" fill="#2ba89a" opacity=".08"/>
  <circle cx="80" cy="760" r="250" fill="#e33045" opacity=".07"/>
  <rect x="70" y="56" width="1260" height="8" rx="4" fill="url(#accent)"/>

  <text x="70" y="124" fill="#62c7bf" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">TRACKING · ARCHITETTURA</text>
  <text x="70" y="184" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="800">Dal contatto al dato verificabile</text>
  <text x="70" y="222" fill="#b8c7d1" font-family="Arial, sans-serif" font-size="22">Eventi, consenso e strumenti collegati al sito in produzione.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="300" width="250" height="300" rx="24" fill="#ffffff"/>
    <rect x="70" y="300" width="250" height="12" rx="6" fill="url(#accent)"/>
    <text x="100" y="358" fill="#0d2235" font-family="Arial, sans-serif" font-size="20" font-weight="800">SITO DIAMA</text>
    <text x="100" y="401" fill="#536675" font-family="Arial, sans-serif" font-size="16">Eventi osservati</text>
    <g font-family="Arial, sans-serif" font-size="18" fill="#0d2235">
      <circle cx="108" cy="450" r="7" fill="#2ba89a"/><text x="128" y="457">Invio form</text>
      <circle cx="108" cy="500" r="7" fill="#2ba89a"/><text x="128" y="507">Click WhatsApp</text>
      <circle cx="108" cy="550" r="7" fill="#2ba89a"/><text x="128" y="557">CTA e campagne</text>
    </g>

    <rect x="410" y="330" width="250" height="240" rx="24" fill="#13334d" stroke="#2ba89a" stroke-width="2"/>
    <circle cx="455" cy="384" r="23" fill="#2ba89a" opacity=".18"/>
    <path d="M446 384l7 7 13-16" fill="none" stroke="#62c7bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="391" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">CONSENSO</text>
    <text x="445" y="444" fill="#b8c7d1" font-family="Arial, sans-serif" font-size="17">I tag partono soltanto</text>
    <text x="445" y="471" fill="#b8c7d1" font-family="Arial, sans-serif" font-size="17">secondo le preferenze</text>
    <text x="445" y="498" fill="#b8c7d1" font-family="Arial, sans-serif" font-size="17">espresse dall’utente.</text>

    <rect x="750" y="330" width="250" height="240" rx="24" fill="#ffffff"/>
    <rect x="785" y="370" width="55" height="55" rx="13" fill="#f4b400"/>
    <path d="M801 384h23v27h-23zM807 378h11v39h-11z" fill="#ffffff" opacity=".92"/>
    <text x="860" y="404" fill="#0d2235" font-family="Arial, sans-serif" font-size="20" font-weight="800">GTM</text>
    <text x="785" y="468" fill="#536675" font-family="Arial, sans-serif" font-size="17">Regole, trigger e inoltro</text>
    <text x="785" y="495" fill="#536675" font-family="Arial, sans-serif" font-size="17">degli eventi configurati.</text>

    <rect x="1090" y="280" width="240" height="110" rx="20" fill="#ffffff"/>
    <circle cx="1135" cy="335" r="24" fill="#f5a623"/>
    <path d="M1124 350v-18h7v18zm13 0v-30h7v30zm13 0v-42h7v42z" fill="#ffffff"/>
    <text x="1175" y="329" fill="#0d2235" font-family="Arial, sans-serif" font-size="18" font-weight="800">GA4</text>
    <text x="1175" y="354" fill="#536675" font-family="Arial, sans-serif" font-size="14">Eventi e conversioni</text>

    <rect x="1090" y="420" width="240" height="110" rx="20" fill="#ffffff"/>
    <circle cx="1135" cy="475" r="24" fill="#1877f2"/>
    <text x="1127" y="485" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="800">f</text>
    <text x="1175" y="469" fill="#0d2235" font-family="Arial, sans-serif" font-size="18" font-weight="800">META PIXEL</text>
    <text x="1175" y="494" fill="#536675" font-family="Arial, sans-serif" font-size="14">Campagne e pubblici</text>

    <rect x="1090" y="560" width="240" height="110" rx="20" fill="#ffffff"/>
    <circle cx="1135" cy="615" r="24" fill="#34a853"/>
    <path d="M1122 624l9-18 8 11 7-15 8 22z" fill="#ffffff"/>
    <text x="1175" y="609" fill="#0d2235" font-family="Arial, sans-serif" font-size="17" font-weight="800">SEARCH CONSOLE</text>
    <text x="1175" y="634" fill="#536675" font-family="Arial, sans-serif" font-size="14">Sitemap e ricerca</text>
  </g>

  <g fill="none" stroke="#62c7bf" stroke-width="4" marker-end="url(#arrow)">
    <path d="M320 450h76"/>
    <path d="M660 450h76"/>
    <path d="M1000 410c48 0 44-75 76-75"/>
    <path d="M1000 450h76"/>
    <path d="M1000 490c48 0 44 125 76 125"/>
  </g>

  <text x="70" y="728" fill="#8fa5b4" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">FORM · WHATSAPP · GTM · GA4 · META PIXEL · SEARCH CONSOLE</text>
</svg>
