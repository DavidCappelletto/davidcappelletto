name: Portfolio responsive QA
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'public/projects/**'
      - 'scripts/portfolio-visual-qa.mjs'
      - '.github/workflows/portfolio-visual-qa.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check responsive pages
        run: |
          npm run start > /tmp/portfolio-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/portfolio-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-responsive-qa
          path: artifacts/portfolio-qa
          retention-days: 7
