<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">Regole chiare, prima del messaggio</title><desc id="desc">Ogni passaggio prevede un controllo.</desc><rect width="960" height="660" rx="28" fill="#f3f7f8"/><g font-family="Arial,sans-serif"><text x="48" y="65" fill="#257d75" font-size="20" font-weight="700" letter-spacing="2">STUDIO DENTISTICO · PROCESSO</text><text x="48" y="122" fill="#14253c" font-size="36" font-weight="700">Regole chiare, prima del messaggio</text><text x="48" y="164" fill="#536576" font-size="23">Ogni passaggio prevede un controllo.</text><rect x="48" y="212" width="864" height="106" rx="18" fill="white" stroke="#d5e1e5"/><circle cx="96" cy="265" r="23" fill="#2ba89a"/><text x="96" y="273" text-anchor="middle" font-size="24" font-weight="700" fill="white">1</text><text x="140" y="254" font-size="27" fill="#14253c" font-weight="700">Verifica</text><text x="140" y="290" font-size="22" fill="#536576">Tempi, consenso e completezza dei dati</text><rect x="48" y="334" width="864" height="106" rx="18" fill="white" stroke="#d5e1e5"/><circle cx="96" cy="387" r="23" fill="#2ba89a"/><text x="96" y="395" text-anchor="middle" font-size="24" font-weight="700" fill="white">2</text><text x="140" y="376" font-size="27" fill="#14253c" font-weight="700">Invia il promemoria</text><text x="140" y="412" font-size="22" fill="#536576">Conferma · Annulla · Richiedi rinvio</text><rect x="48" y="456" width="864" height="106" rx="18" fill="white" stroke="#d5e1e5"/><circle cx="96" cy="509" r="23" fill="#397bd8"/><text x="96" y="517" text-anchor="middle" font-size="24" font-weight="700" fill="white">3</text><text x="140" y="498" font-size="27" fill="#14253c" font-weight="700">Registra la risposta</text><text x="140" y="534" font-size="22" fill="#536576">Conferma oppure anomalia da gestire</text><text x="48" y="618" fill="#536576" font-size="19">Schema dimostrativo · nessun dato personale reale</text></g></svg>