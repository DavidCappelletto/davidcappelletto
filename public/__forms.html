<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><title>Moduli</title><meta name="robots" content="noindex"></head>
<body>
  <!-- Moduli dichiarati per Netlify Forms: i dati arrivano dalle pagine Next.js via fetch -->
  <form name="preregistrazione-ikigai" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="preregistrazione-ikigai">
    <input name="bot-field">
    <input name="nome">
    <input type="email" name="email">
    <input type="checkbox" name="consenso">
    <input name="fonte">
  </form>
</body>
</html>
